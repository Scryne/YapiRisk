version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-kucuk:
        update-types: [minor, patch]
    ignore:
      # Çalışma zamanı Node 24; tip paketi ana sürümü onu izler.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /pipeline
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
