[project]
name = "yapirisk-pipeline"
version = "0.1.0"
description = "YapiRisk bölge paketlerini (tehlike, ayak izi, mahalle, doğrulama) üreten derleme anı boru hattı"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
